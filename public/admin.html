<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utu admin — viewing requests &amp; chats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --white:#FFFFFF; --cream:#FFF6EF;
  --orange:#F05A0E; --orange-deep:#C74108;
  --amber:#FFB25E; --amber-soft:#FFE3C7;
  --ink:#241610; --muted:#93796B; --line:#F3E3D6;
  --ok:#1E6B34; --ok-bg:#EAF7EC; --warn:#8A5B00; --warn-bg:#FFF3D8;
  --radius:16px; --shadow:0 10px 30px rgba(36,22,16,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
/* class rules below set display:flex, which would otherwise beat the browser's [hidden] */
[hidden]{display:none!important}
body{font-family:'Instrument Sans',system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.55}
h1,h2,h3,h4{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:1rem;color:var(--ink)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:6px}
a{color:var(--orange)}

.topbar{display:flex;align-items:center;gap:16px;padding:14px clamp(16px,4vw,32px);
  background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.logo{font-family:'Bricolage Grotesque';font-weight:800;font-size:1.25rem;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.logo span{color:var(--orange)}
.pill{font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);
  background:var(--amber-soft);border-radius:999px;padding:4px 11px}
.topbar .spacer{flex:1}
.btn{background:var(--orange);color:#fff;border:none;border-radius:999px;padding:9px 18px;font-weight:600;font-size:.9rem}
.btn:hover{background:var(--orange-deep)}
.btn.ghost{background:transparent;color:var(--orange);border:1.5px solid var(--orange)}
.btn.ghost:hover{background:var(--amber-soft)}
.btn.small{padding:5px 12px;font-size:.78rem}

/* ---------- Sign in ---------- */
.gate{max-width:400px;margin:14vh auto;background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);
  padding:32px;box-shadow:var(--shadow)}
.gate h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.gate p{color:var(--muted);font-size:.92rem;margin-bottom:20px}
.gate input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--cream);margin-bottom:12px}
.gate .btn{width:100%}
.gate .err{background:#FDEBEB;color:#A82A2A;border-radius:10px;padding:9px 13px;font-size:.85rem;font-weight:600;margin-bottom:12px;display:none}
.gate .err.show{display:block}

.wrap{display:none;padding:clamp(16px,3vw,28px);max-width:1240px;margin:0 auto}
.wrap.on{display:block}

.stats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:22px}
.stat{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.stat b{display:block;font-family:'Bricolage Grotesque';font-size:1.7rem;font-weight:800;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.8rem;color:var(--muted);font-weight:600}
.stat.alert b{color:var(--orange)}

.tabs{display:inline-flex;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:3px;margin-bottom:18px}
.tabs button{border:none;background:transparent;border-radius:999px;padding:9px 20px;font-weight:700;font-size:.9rem;color:var(--muted)}
.tabs button.on{background:var(--ink);color:#fff}
.tabs button .n{font-variant-numeric:tabular-nums;opacity:.75;margin-left:5px}

.panel{display:none}
.panel.on{display:block}

/* ---------- Requests table ---------- */
.tablewrap{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);font-size:.89rem;vertical-align:top}
th{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--cream);
  position:sticky;top:0}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--cream)}
td.who b{display:block}
td.who span{color:var(--muted);font-size:.82rem}
td .quote{color:var(--muted);font-style:italic;display:block;margin-top:3px;max-width:34ch}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:.74rem;font-weight:700}
.status.pending{background:var(--warn-bg);color:var(--warn)}
.status.contacted{background:var(--ok-bg);color:var(--ok)}
.status.closed{background:var(--line);color:var(--muted)}
.mini-master{display:inline-flex;align-items:center;gap:4px;background:var(--ink);color:#fff;border-radius:999px;
  padding:2px 8px;font-size:.68rem;font-weight:700;margin-left:6px}
.rowbtns{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- Chat inbox ---------- */
.inbox{display:grid;grid-template-columns:minmax(230px,300px) 1fr;gap:16px;align-items:start}
.threads{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);overflow:hidden;max-height:70vh;overflow-y:auto}
.thread{display:block;width:100%;text-align:left;border:none;background:transparent;padding:13px 16px;border-bottom:1px solid var(--line)}
.thread:hover{background:var(--cream)}
.thread.on{background:var(--amber-soft)}
.thread b{display:block;font-size:.9rem}
.thread .ph{color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums}
.thread .last{color:var(--muted);font-size:.8rem;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread .waiting{color:var(--orange);font-weight:700}

.convo{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;height:70vh}
.convo-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--cream)}
.convo-head .who{flex:1;min-width:0}
.convo-head h4{font-size:1rem;font-weight:800;letter-spacing:-.01em}
.convo-head p{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.convo-log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:76%;padding:9px 13px;border-radius:14px;font-size:.89rem;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.bubble.user{background:var(--cream);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.bubble.admin{background:var(--orange);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.bubble time{display:block;font-size:.68rem;opacity:.72;margin-top:3px}
.convo-form{display:flex;gap:9px;padding:13px;border-top:1px solid var(--line);background:var(--cream)}
.convo-form input{flex:1;border:1.5px solid var(--line);border-radius:999px;padding:11px 15px;background:#fff;font-size:.9rem}
.empty-convo{flex:1;display:grid;place-items:center;color:var(--muted);font-size:.92rem;padding:30px;text-align:center}

.call-btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;color:var(--ink);
  border-radius:999px;padding:5px 12px;font-size:.78rem;font-weight:700;text-decoration:none}
.call-btn:hover{border-color:var(--orange);color:var(--orange)}
.call-btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;border-style:dashed}
.call-btn[aria-disabled="true"]:hover{border-color:var(--line);color:var(--ink)}

/* ---------- Post a room ---------- */
.rooms-layout{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;align-items:start}
/* narrower than the 820px default: this table shares the row with the form */
.rooms-layout table{min-width:600px}
.rooms-layout td:last-child{text-align:right;white-space:nowrap}
.postbox{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:22px}
.postbox h3{font-size:1.1rem;font-weight:800;letter-spacing:-.02em}
.postbox .sub{color:var(--muted);font-size:.85rem;margin-bottom:16px}
.postbox .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:13px}
.field label{display:block;font-weight:600;font-size:.85rem;margin-bottom:5px}
.field input,.field select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 13px;background:var(--cream)}
.field .note{font-size:.76rem;color:var(--muted);margin-top:4px}
.field label.check{display:flex;align-items:center;gap:9px;font-weight:600;font-size:.88rem;cursor:pointer}
.field label.check input{width:17px;height:17px;accent-color:var(--orange)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.form-msg{border-radius:12px;padding:10px 14px;font-size:.86rem;font-weight:600;margin-top:12px;display:none}
.form-msg.ok{display:block;background:var(--ok-bg);color:var(--ok)}
.form-msg.err{display:block;background:#FDEBEB;color:#A82A2A}
.room-name b{display:block}
.room-name .mini-master{margin-left:0;margin-top:4px}
.danger{border-color:#E5B4B4;color:#A82A2A}
.danger:hover{background:#FDEBEB;border-color:#A82A2A}
@media (max-width:900px){ .rooms-layout{grid-template-columns:1fr} }

.empty{padding:50px 20px;text-align:center;color:var(--muted)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;
  padding:12px 22px;border-radius:999px;font-weight:600;font-size:.92rem;opacity:0;transition:all .3s;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  .topbar{flex-wrap:wrap;gap:10px;padding:12px 16px}
  .topbar .spacer{flex:1 1 auto}
  .tabs{display:flex;max-width:100%;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;white-space:nowrap}
}
@media (max-width:820px){ .inbox{grid-template-columns:1fr} .convo{height:60vh} }

/* Below this the tables stop being tables: each row becomes a labelled card.
   The breakpoint clears the widest table (820px) so no screen ever has to
   scroll a table sideways. */
@media (max-width:860px){
  .tablewrap{overflow-x:visible}
  table{min-width:0;display:block}
  .rooms-layout table{min-width:0}
  thead{display:none}
  tbody{display:block}
  tbody tr{display:flex;flex-direction:column;gap:11px;padding:16px;border-bottom:1px solid var(--line)}
  tbody tr:last-child{border-bottom:none}
  /* label above the value: the cells hold several elements each, so the td
     itself must stay a plain block rather than a grid that reflows them */
  td{display:block;padding:0;border:none;font-size:.9rem;min-width:0}
  td[data-label]::before{content:attr(data-label);display:block;font-size:.66rem;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:3px}
  td .quote{max-width:none}
  td,td b,td span{overflow-wrap:anywhere}
  .rowbtns{justify-content:flex-start}
  .rooms-layout td:last-child{text-align:left}
}
@media (max-width:560px){
  /* wrap onto a second line rather than hiding tabs behind a sideways scroll */
  .tabs{flex-wrap:wrap;overflow:visible;justify-content:flex-start}
  .tabs button{flex:1 1 auto;text-align:center}
  .gate{margin:7vh auto;padding:22px}
  .postbox{padding:18px}
  .postbox .two{grid-template-columns:1fr}
  .stat{padding:13px 15px}
  .stat b{font-size:1.45rem}
  .convo{height:70vh}
  .convo-log{padding:14px}
  .bubble{max-width:88%}
  .modal-actions{flex-wrap:wrap}
  .modal-actions .btn{flex:1 1 auto}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>

<div class="gate" id="gate">
  <h1>Utu admin</h1>
  <div class="err" id="gateErr"></div>
  <input id="keyInput" type="password" placeholder="Admin key" autocomplete="current-password">
  <button class="btn" onclick="signIn()">Sign in</button>
</div>

<div class="topbar" id="topbar" style="display:none">
  <a class="logo" href="/">U<span>tu.</span></a>
  <span class="pill">Admin</span>
  <span class="spacer"></span>
  <button class="btn ghost" onclick="refresh()">Refresh</button>
  <button class="btn ghost" onclick="signOut()">Sign out</button>
</div>

<div class="wrap" id="wrap">
  <div class="stats" id="stats"></div>

  <div class="tabs">
    <button id="tabReq" class="on" onclick="showTab('req')">Viewing requests <span class="n" id="nReq"></span></button>
    <button id="tabChat" onclick="showTab('chat')">Chats <span class="n" id="nChat"></span></button>
    <button id="tabRooms" onclick="showTab('rooms')">Rooms <span class="n" id="nRooms"></span></button>
  </div>

  <section class="panel on" id="panelReq">
    <div class="tablewrap">
      <table>
        <thead>
          <tr><th>Visitor</th><th>Room</th><th>Landlord</th><th>Sent</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="reqBody"></tbody>
      </table>
      <div class="empty" id="reqEmpty" hidden>No viewing requests yet.</div>
    </div>
  </section>

  <section class="panel" id="panelChat">
    <div class="inbox">
      <div class="threads" id="threads"></div>
      <div class="convo">
        <div class="convo-head" id="convoHead" hidden>
          <div class="who">
            <h4 id="convoName"></h4>
            <p id="convoPhone"></p>
          </div>
          <a class="call-btn" id="convoCall">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M4 5c0-.6.4-1 1-1h3l2 5-2.5 1.5a11 11 0 0 0 5 5L14 13l5 2v3c0 .6-.4 1-1 1A14 14 0 0 1 4 5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
            Call
          </a>
        </div>
        <div class="convo-log" id="convoLog"></div>
        <div class="empty-convo" id="convoEmpty">No conversation selected</div>
        <form class="convo-form" id="convoForm" hidden onsubmit="sendReply(event)">
          <input id="replyInput" placeholder="Reply to this visitor…" autocomplete="off" aria-label="Reply">
          <button class="btn" type="submit">Send</button>
        </form>
      </div>
    </div>
  </section>

  <section class="panel" id="panelRooms">
    <div class="rooms-layout">
      <form class="postbox" id="postForm">
        <h3>Post a room</h3>
        <div class="field"><label for="pName">Listing title</label>
          <input id="pName" placeholder="e.g. Sinza Self-contained Single" required></div>
        <div class="field"><label for="pArea">Area / neighbourhood</label>
          <input id="pArea" list="areaList" placeholder="e.g. Sinza" required>
          <datalist id="areaList"></datalist>
        </div>
        <div class="two">
          <div class="field"><label for="pBeds">Bedrooms</label>
            <select id="pBeds"><option value="1">1 bedroom</option><option value="2">2 bedrooms</option></select>
          </div>
          <div class="field"><label for="pPrice">Monthly rent (TZS)</label>
            <input id="pPrice" type="number" min="10000" step="5000" placeholder="70000" required></div>
        </div>
        <div class="field">
          <label class="check"><input type="checkbox" id="pMaster"> Has a master bedroom</label>
        </div>
        <div class="field"><label for="pTags">Features (comma-separated)</label>
          <input id="pTags" placeholder="Self-contained, Water tank, Parking"></div>
        <div class="field"><label for="pPhoto">Photo link (optional)</label>
          <input id="pPhoto" placeholder="https://… link to a photo"></div>
        <div class="two">
          <div class="field"><label for="pLandlord">Landlord name</label>
            <input id="pLandlord" placeholder="e.g. Mama Neema Kessy" required></div>
          <div class="field"><label for="pPhone">Landlord phone</label>
            <input id="pPhone" placeholder="e.g. 0754 000 000" required></div>
        </div>
        <div class="form-msg" id="postMsg"></div>
        <div class="modal-actions">
          <button class="btn ghost" type="button" onclick="clearPostForm()">Clear</button>
          <button class="btn" type="submit" id="postSubmit">Publish room</button>
        </div>
      </form>

      <div class="tablewrap">
        <table>
          <thead><tr><th>Room</th><th>Rent</th><th>Landlord</th><th>Requests</th><th></th></tr></thead>
          <tbody id="roomsBody"></tbody>
        </table>
        <div class="empty" id="roomsEmpty" hidden>No rooms listed yet.</div>
      </div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const tzs = n => Number(n).toLocaleString('en-US');

let KEY = sessionStorage.getItem('utu-admin-key') || '';
let CALLS_ENABLED = false;
let currentSid = null;
let timer = null;

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}
const api = (path, opts={}) => fetch(path, {
  ...opts,
  headers: { 'Content-Type':'application/json', 'x-admin-key': KEY, ...(opts.headers||{}) }
});

/* ---------- Sign in ---------- */
async function signIn(){
  const key = $('keyInput').value.trim();
  const err = $('gateErr');
  if (!key){ err.textContent = 'Enter the admin key.'; err.classList.add('show'); return; }
  try {
    const res = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ key }) });
    if (!res.ok){ err.textContent = 'That key is not right.'; err.classList.add('show'); return; }
    KEY = key;
    sessionStorage.setItem('utu-admin-key', key);
    err.classList.remove('show');
    enter();
  } catch { err.textContent = 'Could not reach the server — is it running?'; err.classList.add('show'); }
}
function signOut(){
  KEY = ''; sessionStorage.removeItem('utu-admin-key');
  clearInterval(timer);
  $('gate').style.display = ''; $('topbar').style.display = 'none'; $('wrap').classList.remove('on');
}
function enter(){
  $('gate').style.display = 'none';
  $('topbar').style.display = 'flex';
  $('wrap').classList.add('on');
  refresh();
  timer = setInterval(refresh, 5000);
}

/* ---------- Loading ---------- */
async function refresh(){
  try {
    const [summary, viewings, chats, listings] = await Promise.all([
      api('/api/admin/summary').then(r=>r.json()),
      api('/api/admin/viewings').then(r=>r.json()),
      api('/api/admin/chats').then(r=>r.json()),
      fetch('/api/listings').then(r=>r.json())
    ]);
    if (summary.error) return signOut();
    CALLS_ENABLED = !!summary.callsEnabled;

    renderStats(summary);
    renderRequests(viewings);
    renderThreads(chats);
    renderRooms(listings, viewings);
    $('nReq').textContent = viewings.length;
    $('nChat').textContent = chats.length;
    $('nRooms').textContent = listings.length;
    if (currentSid) loadConvo(currentSid, true);
  } catch { toast('Could not reach the server.'); }
}

/* ---------- Rooms ---------- */
function renderRooms(listings, viewings){
  $('roomsEmpty').hidden = listings.length > 0;
  const counts = {};
  viewings.forEach(v => { counts[v.listing_name] = (counts[v.listing_name] || 0) + 1; });
  $('roomsBody').innerHTML = listings.map(l=>{
    const n = counts[l.name] || 0;
    return `<tr>
      <td class="room-name" data-label="Room">
        <b>${esc(l.name)}</b>
        <span class="quote">${esc(l.area)} · ${l.beds} bed</span>
        ${l.master ? '<span class="mini-master">Master</span>' : ''}
      </td>
      <td class="num" data-label="Rent">${tzs(l.price)} TZS</td>
      <td class="who" data-label="Landlord"><b>${esc(l.landlord_name || '—')}</b><span>${esc(l.landlord_phone || '')}</span></td>
      <td class="num" data-label="Requests">${n || '—'}</td>
      <td><button class="btn small ghost danger" onclick="removeRoom(${l.id}, ${JSON.stringify(String(l.name))})">Remove</button></td>
    </tr>`;
  }).join('');
}

async function submitPost(e){
  e.preventDefault();
  const msgBox = $('postMsg'); msgBox.className = 'form-msg';
  const body = {
    name: $('pName').value.trim(),
    area: $('pArea').value.trim(),
    beds: +$('pBeds').value,
    master: $('pMaster').checked,
    price: +$('pPrice').value,
    tags: $('pTags').value,
    photo_url: $('pPhoto').value.trim(),
    landlord_name: $('pLandlord').value.trim(),
    landlord_phone: $('pPhone').value.trim()
  };
  if (!body.name || !body.area || !body.price || !body.landlord_name || !body.landlord_phone){
    msgBox.textContent = 'Fill in every field except features and photo.';
    msgBox.className = 'form-msg err'; return;
  }
  $('postSubmit').disabled = true;
  try {
    const res = await api('/api/admin/listings', { method:'POST', body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not post that room.');
    clearPostForm();
    msgBox.textContent = data.message; msgBox.className = 'form-msg ok';
    toast('Room posted — it is live on the site.');
    refresh();
  } catch (err) {
    msgBox.textContent = err.message; msgBox.className = 'form-msg err';
  } finally { $('postSubmit').disabled = false; }
}

function clearPostForm(){
  ['pName','pArea','pPrice','pTags','pPhoto','pLandlord','pPhone'].forEach(id=>$(id).value='');
  $('pMaster').checked = false;
  $('pBeds').value = '1';
  $('postMsg').className = 'form-msg';
}

async function removeRoom(id, name){
  if (!confirm(`Remove "${name}" from the site? Tenants will stop seeing it.`)) return;
  try {
    const res = await api('/api/admin/listings/' + id, { method:'DELETE' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not remove that room.');
    toast('Room removed from the site.');
    refresh();
  } catch (err) { toast(err.message); }
}

function renderStats(s){
  const items = [
    ['Rooms listed', s.listings, false],
    ['With master bedroom', s.master, false],
    ['Viewing requests', s.viewings, false],
    ['Still pending', s.pending, s.pending > 0],
    ['Chat conversations', s.chats, false]
  ];
  $('stats').innerHTML = items.map(([label, n, alert])=>`
    <div class="stat ${alert?'alert':''}"><b>${n}</b><span>${label}</span></div>`).join('');
}

function renderRequests(rows){
  $('reqEmpty').hidden = rows.length > 0;
  $('reqBody').innerHTML = rows.map(r=>`
    <tr>
      <td class="who" data-label="Visitor">
        <b>${esc(r.visitor_name)}</b>
        <span>${esc(r.visitor_phone)}</span>
        ${r.message ? `<span class="quote">"${esc(r.message)}"</span>` : ''}
      </td>
      <td data-label="Room">
        ${esc(r.listing_name)}${r.master ? '<span class="mini-master">Master</span>' : ''}
        <span class="quote">${esc(r.area)} · ${r.beds} bed · ${tzs(r.price)} TZS</span>
      </td>
      <td class="who" data-label="Landlord"><b>${esc(r.landlord_name)}</b><span>${esc(r.landlord_phone)}</span></td>
      <td class="num" data-label="Sent">${esc((r.created_at||'').slice(0,16))}</td>
      <td data-label="Status"><span class="status ${esc(r.status)}">${esc(r.status)}</span></td>
      <td>
        <div class="rowbtns">
          ${callBtn(r.visitor_phone, 'Call')}
          ${r.status !== 'contacted' ? `<button class="btn small ghost" onclick="setStatus(${r.id},'contacted')">Mark contacted</button>` : ''}
          ${r.status !== 'closed' ? `<button class="btn small ghost" onclick="setStatus(${r.id},'closed')">Close</button>` : ''}
        </div>
      </td>
    </tr>`).join('');
  applyCallState();
}

async function setStatus(id, status){
  try {
    const res = await api('/api/admin/viewings/' + id, { method:'PATCH', body: JSON.stringify({ status }) });
    if (!res.ok) throw new Error();
    toast('Marked ' + status + '.');
    refresh();
  } catch { toast('Could not update that request.'); }
}

/* ---------- Chats ---------- */
function renderThreads(chats){
  $('threads').innerHTML = chats.length ? chats.map(c=>`
    <button class="thread ${c.session_id === currentSid ? 'on' : ''}" onclick="loadConvo('${esc(c.session_id)}')">
      <b>${esc(c.visitor_name || 'Visitor')}</b>
      <span class="ph">${esc(c.visitor_phone || 'no phone given')}</span>
      <span class="last ${c.last_sender === 'user' ? 'waiting' : ''}">
        ${c.last_sender === 'user' ? 'Waiting for reply · ' : ''}${esc(c.last_body || '')}
      </span>
    </button>`).join('') : '<div class="empty">No chats yet.</div>';
}

async function loadConvo(sid, quiet){
  currentSid = sid;
  if (!quiet) document.querySelectorAll('.thread').forEach(t=>t.classList.remove('on'));
  try {
    const res = await api('/api/admin/chats/' + sid);
    if (!res.ok) throw new Error();
    const data = await res.json();
    $('convoHead').hidden = false;
    $('convoForm').hidden = false;
    $('convoEmpty').style.display = 'none';
    $('convoName').textContent = data.chat.visitor_name || 'Visitor';
    $('convoPhone').textContent = data.chat.visitor_phone || 'No phone number given';
    $('convoCall').dataset.phone = data.chat.visitor_phone || '';
    $('convoCall').style.display = data.chat.visitor_phone ? '' : 'none';

    const log = $('convoLog');
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
    log.innerHTML = data.messages.map(m=>`
      <div class="bubble ${m.sender}">${esc(m.body)}<time>${esc((m.created_at||'').slice(11,16))}</time></div>`).join('');
    if (atBottom || !quiet) log.scrollTop = log.scrollHeight;
    applyCallState();
  } catch { toast('Could not open that conversation.'); }
}

async function sendReply(e){
  e.preventDefault();
  const input = $('replyInput'), body = input.value.trim();
  if (!body || !currentSid) return;
  input.value = '';
  try {
    const res = await api('/api/admin/chats/' + currentSid, { method:'POST', body: JSON.stringify({ body }) });
    if (!res.ok) throw new Error();
    loadConvo(currentSid);
  } catch { toast('Reply not sent.'); }
}

/* ---------- Calling ---------- */
function callBtn(phone, label){
  return `<a class="call-btn" data-phone="${esc(phone)}">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M4 5c0-.6.4-1 1-1h3l2 5-2.5 1.5a11 11 0 0 0 5 5L14 13l5 2v3c0 .6-.4 1-1 1A14 14 0 0 1 4 5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    ${esc(label)}</a>`;
}
function applyCallState(){
  document.querySelectorAll('.call-btn').forEach(a=>{
    const phone = a.dataset.phone || '';
    if (CALLS_ENABLED && phone){
      a.href = 'tel:' + phone.replace(/\s+/g,'');
      a.removeAttribute('aria-disabled');
      a.title = 'Call ' + phone;
    } else {
      a.removeAttribute('href');
      a.setAttribute('aria-disabled','true');
      a.title = phone ? 'Calling only works when Utu is running on your own machine' : 'No phone number given';
    }
  });
}
document.addEventListener('click', e=>{
  const a = e.target.closest('.call-btn');
  if (a && a.getAttribute('aria-disabled') === 'true'){
    e.preventDefault();
    toast('Calling is only available when Utu runs locally.');
  }
});

function showTab(which){
  ['req','chat','rooms'].forEach(t=>{
    $('tab' + t[0].toUpperCase() + t.slice(1)).classList.toggle('on', t === which);
    $('panel' + t[0].toUpperCase() + t.slice(1)).classList.toggle('on', t === which);
  });
}

$('keyInput').addEventListener('keydown', e=>{ if (e.key === 'Enter') signIn(); });
$('postForm').addEventListener('submit', submitPost);
fetch('/api/areas').then(r=>r.json())
  .then(areas=>{ $('areaList').innerHTML = areas.map(a=>`<option value="${esc(a[0].toUpperCase()+a.slice(1))}"></option>`).join(''); })
  .catch(()=>{});
if (KEY) enter();
</script>
